# Mantém os YAMLs de cluster/argocd atualizados no Kubernetes.
# Este é o único cadastro necessário na configuração inicial.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Claudio-lunardi/vps-infra.git
    targetRevision: main
    path: cluster/argocd
    directory:
      recurse: false
      include: '*.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
