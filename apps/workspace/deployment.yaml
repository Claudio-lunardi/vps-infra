apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspace
  namespace: laboratorio
spec:
  replicas: 5
  selector:
    matchLabels:
      app: workspace
  template:
    metadata:
      labels:
        app: workspace
    spec:
      imagePullSecrets:
        - name: ghcr-workspace
      containers:
        - name: workspace
          image: ghcr.io/claudio-lunardi/workspace@sha256:4879f9f7e1ce3daeb08ab110c7df647f58c16c7b3b92c1db5f6bee7dfb8cb057
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
