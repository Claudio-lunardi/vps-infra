apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspace
  namespace: laboratorio
spec:
  replicas: 5
  selector:
    matchLabels:
      app: workspace
  template:
    metadata:
      labels:
        app: workspace
    spec:
      imagePullSecrets:
        - name: ghcr-workspace
      containers:
        - name: workspace
          image: ghcr.io/claudio-lunardi/workspace@sha256:f10da96d0c050bf9357dd89413e9f56256896b127e8e82c9a3dfdefcddbcccba
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
