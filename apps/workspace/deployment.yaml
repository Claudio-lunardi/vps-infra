apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspace
  namespace: laboratorio
spec:
  replicas: 5
  selector:
    matchLabels:
      app: workspace
  template:
    metadata:
      labels:
        app: workspace
    spec:
      imagePullSecrets:
        - name: ghcr-workspace
      containers:
        - name: workspace
          image: ghcr.io/claudio-lunardi/workspace@sha256:4358341918704e2462b759edce04668d128fe7f8e8ce42180625cd20ff7ff63a
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
