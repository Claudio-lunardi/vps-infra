apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspace
  namespace: laboratorio
spec:
  replicas: 5
  selector:
    matchLabels:
      app: workspace
  template:
    metadata:
      labels:
        app: workspace
    spec:
      imagePullSecrets:
        - name: ghcr-workspace
      containers:
        - name: workspace
          image: ghcr.io/claudio-lunardi/workspace:0800d89812753d4e504323e2dae9ed1978a5507d
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
