apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspace
  namespace: laboratorio
spec:
  replicas: 5
  selector:
    matchLabels:
      app: workspace
  template:
    metadata:
      labels:
        app: workspace
    spec:
      imagePullSecrets:
        - name: ghcr-workspace
      containers:
        - name: workspace
          image: ghcr.io/claudio-lunardi/workspace@sha256:2f007d6a4f00653b3b09ff660b4c03b47c3f557128474b782716474f265df546
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
