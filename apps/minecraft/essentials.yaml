apiVersion: v1
kind: ConfigMap
metadata:
  name: minecraft-essentials
  namespace: laboratorio
data:
  config.yml: |
    # Permissões internas do EssentialsX; jogadores comuns recebem só esta lista.
    # Se instalar LuckPerms no futuro, configure as permissões nele.
    use-bukkit-permissions: false
    player-commands:
      - tpa
      - tpaccept
      - tpdeny
      - tpacancel
    # Solicitações expiram em 60 segundos. Não habilitamos aceite automático.
    tpa-accept-cancellation: 60
    teleport-delay: 3
    teleport-cooldown: 10
    locale: pt_BR
